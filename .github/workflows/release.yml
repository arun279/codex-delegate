name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; must match package.json and plugin.json
        required: true
        type: string
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'arun279/codex-delegate' && github.event.repository.fork == false && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A version-bump merge releases itself once NPM_TOKEN exists; every other push is a no-op.
      # The secrets context is unavailable in the job-level if, so the token presence check lives here.
      - name: Decide whether this run releases
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          proceed=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
            if [ "$HAS_TOKEN" != "true" ]; then
              echo "NPM_TOKEN is not configured; automatic release stays off."
              proceed=false
            elif git ls-remote --exit-code --tags origin "refs/tags/codex-delegate--v${version}" >/dev/null; then
              echo "codex-delegate--v${version} already exists; this push does not bump the version."
              proceed=false
            fi
          fi
          echo "proceed=$proceed" >>"$GITHUB_OUTPUT"

      - name: Require successful CI
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_state=$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json headSha,status,conclusion \
            --jq '.[0] // empty | [.headSha, .status, .conclusion] | @tsv')
          expected_state=$(printf '%s\tcompleted\tsuccess' "$GITHUB_SHA")
          if [ "$ci_state" != "$expected_state" ]; then
            echo "::error::Release requires completed, successful push CI for ${GITHUB_SHA}; observed ${ci_state:-no matching run}." >&2
            exit 1
          fi
          echo "Push CI for ${GITHUB_SHA} completed successfully."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm authentication
        if: steps.gate.outputs.proceed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ] || ! npm whoami >/dev/null 2>&1; then
            echo "::error::Owner action required: create a granular npm token with read/write access, permission to publish the new codex-delegate package, and bypass 2FA enabled; then save it as the NPM_TOKEN repository secret." >&2
            exit 1
          fi

      # Run the release-specific version agreement under the oldest supported Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.9"

      - run: npm install -g npm@11.5.1 @anthropic-ai/claude-code@2.1.220
        if: steps.gate.outputs.proceed == 'true'

      - name: Resolve requested version
        if: steps.gate.outputs.proceed == 'true'
        id: requested
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Version and tag agreement
        if: steps.gate.outputs.proceed == 'true'
        id: version
        env:
          RELEASE_TAG: v${{ steps.requested.outputs.version }}
        run: python3 scripts/release-invariants.py release-versions

      - name: Check npm publication state
        if: steps.gate.outputs.proceed == 'true'
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          error_file="$RUNNER_TEMP/npm-view.err"
          if published=$(npm view "codex-delegate@${RELEASE_VERSION}" version 2>"$error_file"); then
            if [ "$published" != "$RELEASE_VERSION" ]; then
              echo "npm returned unexpected version: $published" >&2
              exit 1
            fi
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "codex-delegate@${RELEASE_VERSION} is already on npm; publication will be skipped."
          else
            status=$?
            if grep -q 'E404' "$error_file"; then
              echo "exists=false" >>"$GITHUB_OUTPUT"
              echo "codex-delegate@${RELEASE_VERSION} is not yet on npm."
            else
              cat "$error_file" >&2
              exit "$status"
            fi
          fi

      - name: Create and push plugin tag
        if: steps.gate.outputs.proceed == 'true'
        env:
          PLUGIN_TAG: codex-delegate--v${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          remote_tag_target() {
            tag_ref="refs/tags/${PLUGIN_TAG}"
            git ls-remote --exit-code --tags origin "$tag_ref" "${tag_ref}^{}" |
              tail -n 1 | cut -f1
          }

          if tag_target=$(remote_tag_target); then
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "::error::${PLUGIN_TAG} resolves to ${tag_target}, not release commit ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "${PLUGIN_TAG} already exists at release commit ${GITHUB_SHA}; tag creation will be skipped."
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            claude plugin tag --push .
            tag_target=$(remote_tag_target) || {
              status=$?
              echo "::error::Could not verify ${PLUGIN_TAG} after creation (git exit ${status})." >&2
              exit "$status"
            }
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "::error::Created ${PLUGIN_TAG} resolves to ${tag_target}, not release commit ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Created ${PLUGIN_TAG} at release commit ${GITHUB_SHA}."
          fi

      - name: Create GitHub release
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="codex-delegate--v${PLUGIN_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists; creation will be skipped."
          else
            gh release create "$tag" \
              --verify-tag \
              --title "codex-delegate v${PLUGIN_VERSION}" \
              --generate-notes
          fi

      - name: Publish npm package
        if: steps.gate.outputs.proceed == 'true' && steps.registry.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
